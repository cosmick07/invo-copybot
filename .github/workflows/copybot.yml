name: copy-bot
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: copybot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          TZ: Australia/Sydney
        run: python copybot.py
      - name: Save results
        if: always()
        run: |
          git config user.name "copy-bot"
          git config user.email "copy-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "bot run $(date -u +%FT%TZ)"
          git pull --rebase && git push
